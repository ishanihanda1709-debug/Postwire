<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Marketing Brief</title>
<meta name="description" content="Trending campaigns and marketing news, each with a LinkedIn post ready to copy.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%233b4bff'/%3E%3Ctext x='16' y='24' font-size='22' text-anchor='middle' fill='white' font-family='Georgia' font-weight='bold'%3EB%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="top"><div class="top-in">
  <h1 class="logo">The Marketing <em>Brief</em></h1>
  <div class="right">
    <span class="status"><i id="dot" class="dot"></i><span id="status-text">Loading…</span></span>
    <span class="ai" id="ai" title=""></span>
    <button class="btn ghost" id="refresh" title="Check the publications for new stories">↻ Fetch new stories</button>
  </div>
</div></header>

<main class="wrap">
  <div class="bar">
    <nav class="tabs" id="tabs" aria-label="Sections">
      <button data-v="trending" class="on">Trending</button>
      <button data-v="campaign">Campaigns</button>
      <button data-v="news">News</button>
      <button data-v="style" id="tab-style">My style <span class="count" id="style-n"></span></button>
      <button data-v="saved" id="tab-saved">♥ Saved <span class="count" id="saved-n"></span></button>
    </nav>
    <div class="seg" id="region" role="group" aria-label="Region">
      <button data-r="all" class="on">All</button><button data-r="india">India</button><button data-r="global">Global</button>
    </div>
    <div class="seg" id="age" role="group" aria-label="How recent"></div>
    <button class="btn" id="shuffle" type="button" title="Swap these for a different set">⟳ Show me different ones</button>
    <label class="search"><span class="sr">Search</span><input id="q" type="search" placeholder="Search" autocomplete="off"></label>
  </div>
  <div id="grid" class="grid"></div>
  <section id="saved" hidden></section>
  <section id="style" hidden></section>
  <div class="more"><button class="btn" id="more" hidden>Show more</button></div>
  <p class="reset"><button class="linkbtn" id="reset" type="button" hidden></button></p>
</main>

<div id="modal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="m-title">
  <div class="sheet"><button class="close" id="close" aria-label="Close">×</button><div id="sheet-body"></div></div>
</div>
<div id="toast" class="toast" hidden></div>
<script src="/app.js" type="module"></script>
</body>
</html>
