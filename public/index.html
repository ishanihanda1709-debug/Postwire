<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{APP_NAME}}</title>
<meta name="description" content="{{TAGLINE}} News in marketing, product and finance, with ready-to-post LinkedIn drafts.">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236D5BF6'/%3E%3Ctext x='16' y='23' font-size='20' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'%3E{{APP_INITIAL}}%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<script src="/theme.js"></script>
<link rel="stylesheet" href="/styles.css">
</head>
<body data-domain="marketing">
<div class="app">
  <aside class="side" id="side">
    <a class="brand" href="#/marketing" aria-label="{{APP_NAME}} home"><span class="mark">{{APP_INITIAL}}</span><span class="bname">{{APP_NAME}}</span></a>
    <nav aria-label="Sections">
      <div class="group">
        <p class="navlabel">News</p>
        <div class="nav" id="nav-domains"></div>
      </div>
      <div class="group group2">
        <p class="navlabel">Your space</p>
        <div class="nav">
          <a href="#/style" data-r="style"><i></i>My style</a>
          <a href="#/saved" data-r="saved"><i></i>Saved <span class="count" id="saved-n"></span></a>
        </div>
      </div>
    </nav>
    <div class="side-foot">
      <button class="btn ghost" id="theme" type="button" aria-label="Switch between light and dark mode">Dark mode</button>
      <a class="me" href="#/account" id="me" aria-label="Your account"></a>
    </div>
  </aside>
  <main class="main" id="main" tabindex="-1"></main>
</div>

<div id="modal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="m-title">
  <div class="sheet"><button class="close" id="close" aria-label="Close">×</button><div id="sheet-body"></div></div>
</div>
<div id="toast" class="toast" hidden></div>
<script src="/app.js" type="module"></script>
</body>
</html>
